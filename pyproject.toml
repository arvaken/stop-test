[project]
name = "arvaken-stop-test"
version = "0.3.0"
description = "A kit you run in your own cloud account: it fires your declared stop on a test agent it deploys, and times what actually stops."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=43",
]

[project.optional-dependencies]
# The AWS module's own calls. Kept optional so the timing rule and the result's format can be read, tested and
# checked by anyone, with no cloud library installed.
aws = ["boto3>=1.35"]

[project.scripts]
stop-test = "arvaken_stop_test.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arvaken_stop_test"]

# The source package holds exactly these, whatever else is in the working tree, so a release's build is the same
# wherever it is made.
[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "LICENSE", "README.md", "pyproject.toml", "PROVIDER-SOURCES.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.uv]
# The build backend and its own dependencies, exactly, so `uv build` makes the same bytes every time: a release's
# SHA-256 can be known, and checked, before it is published. Each version was at least two weeks old when pinned.
build-constraint-dependencies = ["hatchling==1.32.4", "packaging==26.3", "pathspec==1.1.1", "pluggy==1.6.0",
                                 "tomlkit==0.15.1", "trove-classifiers==2026.9.21.13"]
