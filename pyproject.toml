[project]
name = "arvaken-stop-test"
version = "0.1.0.dev0"
description = "A kit you run in your own cloud account: it fires your declared stop on a test agent it deploys, and times what actually stops."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=43",
]

[project.optional-dependencies]
# The AWS module's own calls. Kept optional so the timing rule and the result's format can be read, tested and
# checked by anyone, with no cloud library installed.
aws = ["boto3>=1.35"]

[project.scripts]
stop-test = "arvaken_stop_test.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arvaken_stop_test"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# The lock only: the newest cryptography has no Windows-on-ARM wheel, and one maintainer builds there. Users are not
# held to it: the dependency above stays open.
constraint-dependencies = ["cryptography<=46.0.3"]
