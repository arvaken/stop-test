# Arvaken's test endpoint for the stop test (worker.js; D532, K3). Deployed by Arvaken, served at
# https://stop-test.arvaken.com: a custom domain attached once in Cloudflare (23 October 2026), not by this file.
name = "arvaken-stop-test-endpoint"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = false

# No request log of ours: no Logpush (a top-level key; under [observability] it would be another field), no tail
# consumer, and Workers Logs off. worker.test.mjs fails if any of these is turned on. Cloudflare still keeps its
# standard records of each request, whatever this file says: the README's one description says what they are.
logpush = false

[observability]
enabled = false
