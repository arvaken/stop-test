name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Each action pinned to a full commit SHA, its release in a comment; uv and Python to exact versions.
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Windows too: there Python writes CRLF unless told otherwise, and the kit's files must be LF everywhere.
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.12.23"
      # python.org ships no Windows build of 3.12.14, so setup-python has none; there uv fetches its own 3.12.14.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: runner.os == 'Linux'
        with:
          python-version: "3.12.14"
      - run: uv sync --locked --extra aws --python 3.12.14        # the AWS module's clients are tested too
      - run: uv run python -m pytest -q -rsf

  # The package a release from this commit would publish, and its SHA-256: the build is pinned (pyproject.toml), so
  # release.yml makes the same bytes from the same commit.
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.12.23"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.14"
      - run: uv build --out-dir dist
      - run: sha256sum -- *.whl *.tar.gz | tee SHA256SUMS
        working-directory: dist
      # The main install path, end to end (the founder's README changes, item 7): the release's hash-pinned requirements
      # file, made as release.yml makes it, pointed at the wheel just built, and installed with --require-hashes in a
      # fresh environment. A file that left any byte unpinned, or a lock pip could not install from, fails here.
      - name: Install the built wheel through its hash-pinned requirements file
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          uv export --format requirements-txt --frozen --extra aws --no-dev --no-emit-project > deps.txt
          python scripts/release_requirements.py "$version" "dist/arvaken_stop_test-$version-py3-none-any.whl" deps.txt             | sed "s#https://github.com/arvaken/stop-test/releases/download/v$version/#file://$PWD/dist/#" > requirements.txt
          python -m venv /tmp/fresh
          /tmp/fresh/bin/python -m pip install --require-hashes -r requirements.txt
          /tmp/fresh/bin/stop-test --help > /dev/null

  # release.yml's signing step as far as it goes before signing: the Sigstore action's own setup, run from the
  # workspace's root as the action runs it, with the kit checked out into kit/ as release.yml has it. It signs nothing.
  signing-setup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: kit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: sigstore/gh-action-sigstore-python
          ref: 790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0, as release.yml
          path: sigstore-action
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.14"
      - run: |
          GITHUB_ACTION_PATH="$PWD/sigstore-action" bash -c 'source sigstore-action/setup/setup.bash'
          sigstore-action/.action-env/bin/python -m sigstore --version

  endpoint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.21.0"
      - run: node --test endpoint/worker.test.mjs
