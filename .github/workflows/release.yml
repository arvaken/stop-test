name: release

# A release is made only from a version tag a maintainer pushes, on a commit already on main. Its tests run again; the
# package is built (pinned, so the same commit gives the same bytes as ci.yml's build); each file's SHA-256 is written
# to SHA256SUMS; and each file, SHA256SUMS included, is signed with Sigstore's keyless signing as this workflow's own
# identity, so each signature is recorded in the public Rekor log (D539). Nothing here holds a key.
#
# The kit is checked out into kit/, not the workspace's root: the Sigstore action installs its own tools with
# `uv pip` from the root, and there uv would read the kit's pyproject.toml and its lock-only constraint on cryptography,
# which the action's own pins do not meet (the first v0.1.0 run failed so, before signing anything). ci.yml's
# signing-setup job runs the action's setup the same way, signing nothing.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Each action pinned to a full commit SHA, its release in a comment; uv and Python to exact versions.
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write         # to publish the release
      id-token: write         # Sigstore's keyless signing: the identity GitHub gives this workflow's run
    defaults:
      run:
        working-directory: kit
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: kit
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.12.23"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.14"
      - name: The tag is the package's version, on a commit on main
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$GITHUB_REF_NAME" = "v$version" || { echo "the tag $GITHUB_REF_NAME is not v$version"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$GITHUB_SHA is not on main"; exit 1; }
      - run: uv sync --locked --extra aws
      # STOP_TEST_RELEASE: a release publishes only with a passing record of IAM's policy simulator, run in install-test,
      # for the very policy and case files it releases (tests/test_policy_cases.py; the founder, 29 October 2026).
      - run: uv run python -m pytest -q -rsf
        env:
          STOP_TEST_RELEASE: "1"
      - run: uv build --out-dir dist
      # The hash-pinned requirements file the README installs from (the founder's README changes, item 7): the wheel by
      # its address and SHA-256, every package by its hashes from uv.lock. Signed below with the other files.
      - name: The hash-pinned requirements file
        run: |
          version="${GITHUB_REF_NAME#v}"
          uv export --format requirements-txt --frozen --extra aws --no-dev --no-emit-project > deps.txt
          python scripts/release_requirements.py "$version" "dist/arvaken_stop_test-$version-py3-none-any.whl" deps.txt             > "dist/requirements-$version.txt"
      - run: sha256sum -- *.whl *.tar.gz requirements-*.txt | tee SHA256SUMS
        working-directory: kit/dist
      - uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: ./kit/dist/*.whl ./kit/dist/*.tar.gz ./kit/dist/requirements-*.txt ./kit/dist/SHA256SUMS
          verify: true
          verify-cert-identity: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
          verify-oidc-issuer: https://token.actions.githubusercontent.com
          release-signing-artifacts: false      # this job publishes the release itself, below
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            echo "The stop test kit, version $version. How to install it, check it and run it: README.md."
            echo
            echo "SHA-256 of each file:"
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
            echo
            echo "Each file is signed with Sigstore's keyless signing by this repository's release workflow. Its signature is beside it (.sigstore.json) and is recorded in the public Rekor log."
          } > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md
